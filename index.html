<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>NEBULOSA</title>
<link href="fonts/jetbrains-mono.css" rel="stylesheet">
<style>
:root{
  --green:#00FF00; --dim:#00A000; --mid:#00AA00; --cyan:#00CED1; --red:#FF6347;
  --yellow:#FFFF00; --magenta:#FF00FF; --bg:#0A0E27;
  --tint:#00FF00; --scan:.12; --hold:0; --bright:1; --bezel:#cfcfcf; --grime:#453e33; --dirt:rgba(28,17,9,.6);
  --mono:'JetBrains Mono','Courier New',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#000;color:var(--green);font-family:var(--mono);overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#001a00 0%,#000 100%)}

/* ===== aparelho ===== */
#device{
  position:relative;width:100%;height:100%;max-width:430px;max-height:900px;
  display:flex;flex-direction:column;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:radial-gradient(ellipse at center,#001a00 0%,#000 100%);
  border:3px solid #333;box-shadow:inset 0 0 40px rgba(0,0,0,.8),0 0 60px rgba(0,255,0,.1);
  clip-path:polygon(2% 0,98% 0,100% 1%,100% 99%,98% 100%,2% 100%,0 99%,0 1%);
}
@media (min-width:600px){ #device{height:min(100%,900px);border-radius:24px;clip-path:none} }

/* Parafusos Allen decorativos — na face interna da moldura externa, como se fechassem a tampa do painel.
   Só decoração (sem função, sem clique); tamanhos variados; cantos com mais folga pro corte diagonal do clip-path mobile. */
.screw{position:absolute;z-index:3;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 32% 28%,#9a9a9a 0%,#4a4a4a 55%,#1a1a1a 100%);
  box-shadow:0 1px 1px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 1px rgba(0,0,0,.6)}
.screw::after{content:'';position:absolute;inset:26%;
  background:radial-gradient(circle at 35% 30%,#3a3a3a,#050505 75%);
  clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.9)}
.screw.sm{width:5px;height:5px}
.screw.md{width:7px;height:7px}
.screw.lg{width:9px;height:9px}
.screw.p-tl{top:4px;left:9px}
.screw.p-tr{top:4px;right:9px}
.screw.p-bl{bottom:calc(9px + env(safe-area-inset-bottom));left:9px}
.screw.p-br{bottom:calc(9px + env(safe-area-inset-bottom));right:9px}
.screw.p-tc-l{top:4px;left:calc(50% - 42px)}
.screw.p-tc-r{top:4px;right:calc(50% - 42px)}
.screw.p-lm{top:50%;left:3px;transform:translateY(-50%)}
.screw.p-rm{top:50%;right:3px;transform:translateY(-50%)}
.screw.p-bc-l{bottom:calc(4px + env(safe-area-inset-bottom));left:32%}
.screw.p-bc-r{bottom:calc(4px + env(safe-area-inset-bottom));right:32%}

/* topo: câmera + HUB (fora da tela) */
.top{display:flex;align-items:center;justify-content:space-between;height:64px;flex:none}
.dbg{display:flex;gap:4px;width:110px}
.dbg button{width:22px;height:22px;font:8px var(--mono);border:1px solid #2a2a2a;border-radius:6px;
  background:linear-gradient(180deg,#161616,#0a0a0a 60%,#050505);color:#555;cursor:pointer;padding:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 -1px 2px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.4);
  transition:transform .08s}
.dbg button.on{border-color:var(--bezel);color:var(--bezel)}
.dbg button:active{transform:translateY(1px);box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
/* Câmera — inspirada no HAL 9000 (2001): um só olho, lente vermelha funda, glint fixo, respiração calma e lenta (nunca frenética) */
.camera{width:56px;height:56px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 32% 28%,#4a4a4a 0%,#1c1c1c 55%,#050505 100%);
  border:3px solid #555;box-shadow:0 0 0 1px #0a0a0a,inset 0 2px 3px rgba(255,255,255,.12),inset 0 -4px 8px rgba(0,0,0,.85);
  animation:halBreathe 6s ease-in-out infinite}
.camera i{position:absolute;inset:10px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#ff5a3a 0%,#8a1206 45%,#1a0000 100%);
  box-shadow:0 0 10px rgba(255,40,20,.5),inset 0 0 8px rgba(0,0,0,.7)}
.camera b{position:absolute;top:17px;left:21px;width:5px;height:5px;border-radius:50%;
  background:#fff8ee;box-shadow:0 0 5px #fff,0 0 10px rgba(255,170,120,.7);animation:halGlint 6s ease-in-out infinite}
@keyframes halBreathe{0%,100%{box-shadow:0 0 0 1px #0a0a0a,inset 0 2px 3px rgba(255,255,255,.12),inset 0 -4px 8px rgba(0,0,0,.85),0 0 5px rgba(255,20,10,.2)}
  50%{box-shadow:0 0 0 1px #0a0a0a,inset 0 2px 3px rgba(255,255,255,.12),inset 0 -4px 8px rgba(0,0,0,.85),0 0 15px rgba(255,20,10,.5)}}
@keyframes halGlint{0%,100%{opacity:.8}50%{opacity:1}}

/* botões físicos */
.key{font:700 11px var(--mono);letter-spacing:.5px;text-transform:uppercase;cursor:pointer;border-radius:9px;padding:12px 14px;
  transition:transform .05s;position:relative}
.key.light{background:linear-gradient(145deg,#f0f0f0,#b0b0b0);color:#000;border:3px outset #fff;border-right:4px solid #404040;border-bottom:4px solid #404040;
  box-shadow:4px 4px 0 rgba(0,0,0,.5),6px 6px 12px rgba(0,0,0,.6)}
/* fora da tela simulada: painel físico, sem o verde do terminal — cinza claro (--bezel).
   Volume suave e realista (bisel + sombra com blur), não mais a sombra dura "retrô blocado" de antes. */
.key.dark{background:linear-gradient(180deg,#3f3f3f,#242424 55%,#141414);color:var(--bezel);border:1px solid #060606;
  text-shadow:0 0 6px rgba(255,255,255,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -3px 4px rgba(0,0,0,.5),0 3px 5px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.35);
  transition:transform .08s,box-shadow .08s}
.key.dark:active{transform:translateY(1px);
  box-shadow:inset 0 2px 3px rgba(0,0,0,.6),inset 0 -1px 0 rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.35)}
/* HUB — knob industrial retrô (reset/eject), não uma tecla retangular */
.key.hub{width:52px;height:52px;padding:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:radial-gradient(circle at 32% 26%,#4c4c4c 0%,#232323 65%,#111 100%);
  border:3px solid #666;border-right-color:#0a0a0a;border-bottom-color:#0a0a0a;
  box-shadow:0 3px 0 #000,0 6px 10px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.15),0 0 0 3px #0a0a0a,0 0 0 4px #3a3a3a}
.key.hub i{position:static;width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px var(--cyan);animation:blink 1.6s steps(1) infinite}
.key.hub span{font-size:7px;letter-spacing:1.5px;color:var(--bezel);text-shadow:0 0 4px rgba(255,255,255,.4)}
.key.hub:active{transform:translateY(2px);box-shadow:0 1px 0 #000,inset 0 1px 0 rgba(255,255,255,.1),0 0 0 3px #0a0a0a,0 0 0 4px #3a3a3a}
.key.hub:active i{background:var(--red);box-shadow:0 0 8px var(--red)}
.key:active{transform:translate(3px,3px);box-shadow:1px 1px 0 rgba(0,0,0,.5)}

/* ===== tela interna (só conteúdo) ===== */
.screen{flex:1;min-height:0;margin:8px 0;position:relative;overflow:hidden;display:flex;flex-direction:column;
  background:linear-gradient(135deg,#1a1a1a,#0d0d0d);border:2px solid #555;border-radius:32px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 20px 60px rgba(0,0,0,.8),0 0 30px rgba(0,255,0,.05)}
.hdr{padding:12px 18px;background:linear-gradient(180deg,#1a1a1a,#0d0d0d);border-bottom:1px solid var(--tint);flex:none}
.room{font-weight:700;font-size:12px;letter-spacing:1px;color:var(--tint);text-shadow:0 0 10px currentColor}
.stamp{font-size:8px;color:var(--mid);margin-top:3px;letter-spacing:.5px}
.content{flex:1;min-height:0;position:relative;background:linear-gradient(135deg,rgba(0,20,0,.3),rgba(0,10,0,.5));
  filter:var(--filter,hue-rotate(0deg)) brightness(var(--bright,1));animation:flicker .15s infinite}
.p2{--filter:hue-rotate(15deg)} .p3{--filter:hue-rotate(-30deg) saturate(1.3)} .p4{--filter:hue-rotate(140deg) saturate(1.5)}
@keyframes flicker{0%,100%{opacity:1}5%{opacity:.97}10%{opacity:1}15%{opacity:.98}20%{opacity:1}}
.scroll{position:absolute;inset:0 0 26px 0;overflow-y:auto;padding:10px;scrollbar-width:thin;scrollbar-color:var(--mid) #050505}
/* Rolagem escura com o mesmo grafismo do resto (verde do terminal, leve brilho) — nada de barra cinza de sistema */
.scroll::-webkit-scrollbar,.gbody::-webkit-scrollbar{width:7px}
.scroll::-webkit-scrollbar-track,.gbody::-webkit-scrollbar-track{background:#050505;border-left:1px solid #0a2a0a}
.scroll::-webkit-scrollbar-thumb,.gbody::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,var(--mid),#005500);border:1px solid var(--dim);border-radius:1px;
  box-shadow:0 0 4px rgba(0,255,0,.3)}
.scroll::-webkit-scrollbar-thumb:hover,.gbody::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--green),var(--mid))}
.box{background:linear-gradient(180deg,#0a1a0a,#050d05);border:2px solid var(--mid);padding:14px;position:relative;
  box-shadow:inset 0 1px 0 rgba(0,255,0,.2),0 0 20px rgba(0,255,0,.1);text-shadow:0 0 2px rgba(0,255,0,.3)}
.ic{font-size:24px;margin-bottom:10px}
.txt{font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;min-height:5em}
.tx{font-size:10px;color:var(--cyan);margin-bottom:8px;white-space:pre-wrap;word-break:break-word}
.bio{margin-top:12px;background:rgba(0,0,0,.6);border:1px solid rgba(0,255,0,.3);padding:8px 10px;font-size:11px;color:var(--mid)}
.bio div{margin:3px 0}
.tr{font-size:8px;line-height:1.5;color:var(--dim);margin-top:8px;padding:6px 8px;border-left:2px solid var(--dim);white-space:pre-wrap;word-break:break-word}
.tr b{display:block;font-style:normal;font-size:8px;letter-spacing:1px;color:var(--cyan);margin-bottom:2px}
.meta{font-size:9px;color:var(--dim);margin-top:12px;padding-top:8px;border-top:1px solid rgba(0,255,0,.2)}
.acc{color:var(--cyan)}
.box.chave{border-color:var(--cyan);box-shadow:inset 0 1px 0 rgba(0,206,209,.25),0 0 22px rgba(0,206,209,.28)}
.box.chave .ic{color:var(--cyan)}
.box.chave .txt{line-height:1.75}
.loc{color:var(--cyan);opacity:.85}
.hud{position:absolute;left:0;right:0;bottom:0;height:26px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;
  font-size:8px;color:var(--dim);z-index:6;background:rgba(0,10,0,.6)}
.scanlines{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:var(--scan);
  background-image:repeating-linear-gradient(0deg,rgba(0,255,0,.5) 0,rgba(0,255,0,.5) 2px,transparent 2px,transparent 3px);
  animation:scanMove 30s linear infinite}
@keyframes scanMove{to{background-position:0 900px}}
.sweep{position:absolute;left:0;right:0;height:80px;top:-80px;z-index:6;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(0,255,0,.07),transparent);animation:sweep 8s linear infinite}
@keyframes sweep{to{top:100%}}
.p4 .scanlines{animation:scanMove 30s linear infinite,scanBlink .7s steps(2) infinite}
@keyframes scanBlink{0%{opacity:.56}50%{opacity:.7}}
.glitch{animation:glitchTxt .6s steps(2) infinite}
@keyframes glitchTxt{0%,100%{text-shadow:none}30%{text-shadow:2px 0 #0f0,-2px 0 #0ff}60%{text-shadow:-2px 0 #f0f,2px 0 #0ff}}
.fadein{animation:fadein .9s steps(9)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.standby{position:absolute;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;color:var(--dim);font-size:11px;letter-spacing:2px}
.standby.on{display:flex}

/* ===== navegação + painel ===== */
.nav{display:flex;justify-content:space-between;gap:4px;margin:2px 2px 12px;flex:none}
.nav .key{flex:1;padding:10px 2px;font-size:9px;letter-spacing:0;white-space:nowrap;text-align:center}
#rx{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1}
#rx b{font-size:10px}
#rx i{font-style:normal;font-size:9px;font-weight:400;color:var(--cyan)}
#rx.arriving b{animation:blink .6s steps(1) infinite}
.key.dark.lk{border-color:var(--red);color:var(--red);text-shadow:0 0 6px rgba(255,99,71,.6);box-shadow:0 0 12px rgba(255,99,71,.5),inset 0 0 10px rgba(255,99,71,.15)}
.key.dark.on{border-color:var(--bezel);box-shadow:0 0 12px rgba(255,255,255,.55),inset 0 0 10px rgba(255,255,255,.18)}
.panel{display:flex;align-items:center;justify-content:space-between;padding:0;flex:none;gap:4px}
.colA{display:flex;flex-direction:column;align-items:center;justify-content:space-between;height:132px;width:60px}
.leds{display:flex;flex-wrap:wrap;width:60px;justify-content:center}
.led{width:8px;height:8px;border-radius:50%;margin:2px;background:#333;border:.5px solid rgba(0,206,209,.4)}
.led.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.led.warn{background:var(--yellow);box-shadow:0 0 6px var(--yellow)}
.led.err{background:var(--red);box-shadow:0 0 6px var(--red)}
.led.mag{background:var(--magenta);box-shadow:0 0 6px var(--magenta)}
.led.blink{animation:blink .6s steps(1) infinite}
.leds.rxing .led{animation:blink .5s steps(1) infinite}
.led.fast{animation:blink .5s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.3}}
.sliders{display:flex;gap:6px}
.sl{display:flex;flex-direction:column;align-items:center;gap:4px}
.track{width:22px;height:94px;position:relative;border:1px solid #333;background:#0a0a0a;border-radius:2px;touch-action:none;cursor:pointer}
.track::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--cyan);opacity:.5}
.track.locked{border-color:var(--red)}
.thumb{position:absolute;left:1px;right:1px;height:8px;border:1px solid;border-radius:1px}
.thumb.act{filter:invert(1)}
.sl label{font-size:9px;color:var(--bezel)}
.sync{flex:none;width:64px;height:64px;border-radius:50%;cursor:pointer;color:var(--bezel);font-size:26px;display:flex;align-items:center;justify-content:center;
  border:2px solid color-mix(in srgb,var(--green) calc(var(--hold)*100%),var(--cyan));background:radial-gradient(circle at 30% 30%,#1a2a2a,var(--bg));
  box-shadow:0 0 10px rgba(0,206,209,.3),inset 0 2px 4px rgba(255,255,255,.1);transition:transform .15s,box-shadow .15s;touch-action:none;font-family:var(--mono)}
.sync:hover{transform:scale(1.1);box-shadow:0 0 14px rgba(0,206,209,.7)}
.sync.red{border-color:var(--red)!important;background:#3a1510}
.sync.grn{border-color:var(--green)!important}
.sync.osc{animation:osc 2s ease-in-out infinite}
@keyframes osc{0%,100%{border-color:var(--cyan)}50%{border-color:#00E600}}
.micro{flex:none;display:grid;grid-template-columns:repeat(3,30px);gap:4px}
.micro button{width:30px;height:30px;border:1px solid var(--bezel);border-radius:7px;
  background:linear-gradient(180deg,#161c3a,var(--bg) 55%,#05071a);color:var(--bezel);font:11px var(--mono);cursor:pointer;padding:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -2px 3px rgba(0,0,0,.5),0 2px 3px rgba(0,0,0,.4);
  transition:transform .08s}
.micro button:hover{border-color:var(--magenta)}
.micro button:active{transform:translateY(1px)}
.micro button.f{background:var(--bezel);color:#000}
/* cinza escuro "encardido" no lugar do azul — sujo, não limpo. Sujeira parda acumulada nos 4 cantos
   da cavidade, que "não sai": mesmos 4 pontos radiais nos dois estados (liga/desliga), só a base muda. */
.toggle{width:44px;height:24px;border-radius:12px;position:relative;cursor:pointer;transition:background .2s linear;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,255,255,.05);
  background:
    radial-gradient(circle 7px at 4px 4px,var(--dirt),transparent 70%),
    radial-gradient(circle 7px at 40px 4px,var(--dirt),transparent 70%),
    radial-gradient(circle 7px at 4px 20px,var(--dirt),transparent 70%),
    radial-gradient(circle 7px at 40px 20px,var(--dirt),transparent 70%),
    var(--grime)}
.toggle.off{background:
    radial-gradient(circle 7px at 4px 4px,var(--dirt),transparent 70%),
    radial-gradient(circle 7px at 40px 4px,var(--dirt),transparent 70%),
    radial-gradient(circle 7px at 4px 20px,var(--dirt),transparent 70%),
    radial-gradient(circle 7px at 40px 20px,var(--dirt),transparent 70%),
    #555}
.toggle i{position:absolute;top:3px;left:23px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s linear}
.toggle.off i{left:3px}
.toggle.g i{left:20px}


/* ===== B1–B3: painéis temporais, gaveta de análise ===== */
:root{--led-red:#FF0000;--amber:#FFB000;--paper:#E8E2C8;--ink:#1A1A1A}
.tp{flex:none;margin:2px 8px 0;padding:3px 10px;background:#000;border:1px solid #400;border-radius:2px;font:700 9px var(--mono);letter-spacing:1px;color:var(--led-red);text-shadow:0 0 5px rgba(255,0,0,.6);display:flex;flex-direction:column;gap:1px;line-height:1.25;white-space:nowrap;overflow:hidden}
.cs{flex:none;display:none;margin:0 8px 2px;padding:3px 10px;background:#000;border:1px solid #044;color:var(--cyan);font:9px var(--mono);line-height:1.35;white-space:nowrap;overflow:hidden}
.cs.on{display:block}
/* Agora é FILHO de .screen (não de #device): inset:0 encaixa exatamente no tamanho real da tela simulada,
   sempre em sincronia (mesma altura flexível, mesmo raio de 32px, mesmo overflow:hidden do pai) — sem precisar
   copiar medidas manualmente. Os parafusos ficam de fora porque são de #device, um nível acima. */
.gav{position:absolute;inset:0;z-index:40;background:#030a03;display:flex;flex-direction:column;padding:16px}
.gav::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.15;
  background-image:repeating-linear-gradient(0deg,rgba(0,255,0,.5) 0,rgba(0,255,0,.5) 2px,transparent 2px,transparent 3px);
  animation:scanMove 30s linear infinite}
.gav[hidden]{display:none}
.gtabs{display:flex;gap:3px;flex:none}
.gtabs button{flex:1;min-width:0;font:700 8px var(--mono);padding:9px 1px;background:#111;color:var(--mid);border:1px solid #333;cursor:pointer;text-transform:uppercase}
.gtabs button.on{border-color:var(--green);color:var(--green);background:#031503}
.gtabs .x{flex:none;width:34px;color:var(--red);border-color:#622;font-size:12px}
.gbody{flex:1;min-height:0;overflow-y:auto;margin-top:8px;border:1px solid #063;padding:10px;font:10px/1.5 var(--mono);color:var(--mid);scrollbar-width:thin;scrollbar-color:var(--mid) #050505}
.gbody h4{margin:12px 0 4px;font-size:10px;color:var(--cyan);letter-spacing:1px}
.gbody h4:first-child{margin-top:0}
.gbody .row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #063;padding:2px 0}
.gbody .row b{color:var(--green);font-weight:400;text-align:right}
.gbody .btn{font:700 9px var(--mono);padding:6px 9px;background:#131;color:var(--green);border:1px solid var(--mid);cursor:pointer}
.gbody .item{border:1px solid #063;padding:6px 8px;margin:6px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}
.gbody .item.cur{border-color:var(--green)}
.gbody .item small{display:block;color:var(--dim)}
.gbody canvas{width:100%;height:120px;background:#000;border:1px solid #063;display:block}
.gbody details{border:1px solid #063;padding:6px 8px;margin:6px 0}
.gbody summary{cursor:pointer;color:var(--green)}
.gbody pre{margin:6px 0 0;white-space:pre-wrap;font:inherit;color:var(--mid)}
.tape{background:var(--paper);color:var(--ink);padding:8px;font:9px/1.5 var(--mono);white-space:pre-wrap;border-left:6px dotted #999;min-height:120px}
.mx{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mx i{display:block;height:26px;border:1px solid #063;border-radius:2px;font:8px var(--mono);font-style:normal;text-align:center;line-height:26px;color:#0a5}
.mx i.cur{background:var(--green);color:#000;box-shadow:0 0 8px var(--green)}
.mx i.vis{background:#3a2a00;color:var(--amber);border-color:var(--amber)}
.mx i.off{opacity:.35}
.mx.p4 i.cur{animation:blink 1.6s steps(1) infinite}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* ===== B4: acessibilidade ===== */
:focus-visible{outline:2px solid #FFFF00;outline-offset:2px}
.track:focus-visible,.sync:focus-visible{outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .scanlines{opacity:calc(var(--scan) * .6)}
}
</style>
</head>
<body>
<div id="device">
  <i class="screw lg p-tl" aria-hidden="true"></i><i class="screw lg p-tr" aria-hidden="true"></i>
  <i class="screw lg p-bl" aria-hidden="true"></i><i class="screw lg p-br" aria-hidden="true"></i>
  <i class="screw md p-tc-l" aria-hidden="true"></i><i class="screw md p-tc-r" aria-hidden="true"></i>
  <i class="screw sm p-lm" aria-hidden="true"></i><i class="screw sm p-rm" aria-hidden="true"></i>
  <i class="screw sm p-bc-l" aria-hidden="true"></i><i class="screw sm p-bc-r" aria-hidden="true"></i>
  <div class="top">
    <div class="dbg" id="dbg"></div>
    <div class="camera"><i></i><b></b></div>
    <button class="key hub" id="hub" aria-label="HUB: novo início aleatório"><i></i><span>HUB</span></button>
  </div>

  <div class="tp" id="tp" aria-hidden="true"><span id="tp1"></span><span id="tp2"></span></div>

  <div class="screen">
    <div class="hdr"><div class="room" id="room"></div><div class="stamp" id="stamp"></div><div class="stamp loc" id="loc">LOC: aguardando sinal...</div><div class="stamp loc" id="locOrigin">ORIGEM: 23.5505°S 46.6333°O · SÃO PAULO</div></div>
    <div class="content" id="content">
      <div class="scroll" id="scroll">
        <div class="box">
          <div class="tx" id="tx"></div>
          <div class="ic" id="ic"></div>
          <div class="txt" id="txt" aria-hidden="true"></div>
          <div class="tr" id="tr" aria-hidden="true" hidden></div>
          <div class="bio" id="lines"></div>
          <div class="meta" id="meta"></div>
        </div>
      </div>
      <div class="hud"><span id="live"></span><span id="foot"></span></div>
      <div class="scanlines"></div><div class="sweep"></div>
    </div>
    <div class="standby" id="standby">SISTEMA EM REPOUSO</div>

  </div>

  <div class="nav">
    <button class="key dark" id="prev" aria-label="Fragmento anterior na cadeia">← ANTERIOR</button>
    <button class="key dark" id="listen" aria-label="Pausar ou retomar a leitura" aria-pressed="false"><span id="rx" aria-live="polite"></span></button>
    <button class="key dark" id="lock" aria-label="Travar o fragmento na tela">LOCK</button>
    <button class="key dark" id="undo" aria-label="Desfazer: voltar ao fragmento visto antes">UNDO ↶</button>
    <button class="key dark" id="next" aria-label="Próximo fragmento na cadeia">PRÓXIMO →</button>
  </div>

  <div class="panel">
    <div class="colA"><div class="leds" id="leds"></div><div class="toggle" id="toggle"><i></i></div></div>
    <div class="sliders" id="sliders"></div>
    <button class="sync" id="sync" title="Toque: próximo · Segure: aceitar">⊕</button>
    <div class="micro" id="micro"></div>
  </div>

</div>

<script src="banco-de-frases-v5.js"></script>
<script src="revelacoes.js"></script>
<script src="degradacao.js"></script>
<script>
const REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
</script>
<script>
/* ================= DADOS ================= */
// Adaptador: aceita o banco autoral (ISLANDS/fragments) ou o formato ROOMS/FRAG
const DB=window.NEBULOSO_DB;
let ROOMS,FRAG;const FLAVOR=DB.FLAVOR;
if(DB.ISLANDS){
  ROOMS=DB.ISLANDS.map(i=>({id:i.id,name:i.name,phase:i.phase,kw:i.keywords,icon:i.fragments[0].icon}));
  FRAG={};DB.ISLANDS.forEach((isl,ii)=>{FRAG[isl.id]=isl.fragments.map(f=>({icon:f.icon,m:f.text,d:f.meta.split(' | '),t:f.type,tag:`${f.type}-${String(ii+1).padStart(2,'0')} ${f.tags}`}))});
}else{ROOMS=DB.ROOMS;FRAG=DB.FRAG}
/* ================= ESTADO ================= */
const $=s=>document.querySelector(s);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const store={
  get(k,d){try{const v=localStorage.getItem('nebuloso_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('nebuloso_'+k,JSON.stringify(v))}catch(e){}}
};
const S={
  room:'validacao_falsaria', idx:0, seed:Math.random(), tick:0, ts:null, nextIn:8, arriving:false,
  bpm:72, cort:35, temp:36.4,
  sl:{scan:20,brgt:70,sgnl:68}, lock:{scan:0,brgt:0,sgnl:0},
  standby:false, demo:store.get('demo',true), demoPhase:1, override:null,
  accepted:{}, seen:0, tx:'',
  hours:store.get('hours',0), rejected:store.get('rejected',0), lastSeen:store.get('last',Date.now()),
  events:store.get('events',[]), t0:Date.now(),
};
// Timestamps impossíveis: presentes em 100% dos fragmentos
const pad4=n=>String(n).padStart(4,'0');
function impossibleStamp(){
  const sent=rnd(['T+'+pad4(89+Math.floor(Math.random()*900)),'T+0089','T+2089','T-'+pad4(Math.floor(Math.random()*40))]);
  const read=rnd(['T-0011','T-'+pad4(1+Math.floor(Math.random()*60)),'T+0000','T-NULL']);
  const made=rnd(['T-NULL','T-∞','T-NULL','T+∞']);
  const clock=`${rnd(['25','26','27','24'])}:${String(Math.floor(Math.random()*60)).padStart(2,'0')}`;
  const mark=rnd(['confirmada? negada? ambas','sempre esteve aqui','lida antes de enviada','pendente desde T-NULL']);
  return {sent,read,made,clock,mark};
}
S.ts=impossibleStamp();
// Repouso: 24h sem abrir => recua 1 fase (piso 1) no modo real
if(Date.now()-S.lastSeen>864e5){S.hours=Math.min(S.hours,19.9);S.rejected=Math.max(0,S.rejected-3);}
function realPhase(){
  const h=S.hours+(Date.now()-S.t0)/36e5;
  if(h>=20)return 4; if(S.rejected>=3&&h>=3)return 3; if(S.rejected>=3||h>=3)return h>=3?2:1; return 1;
}
const phase=()=>S.override||(S.demo?S.demoPhase:realPhase());
const room=()=>ROOMS.find(r=>r.id===S.room);
const frags=()=>FRAG[S.room];
const frag=()=>S.special||frags()[Math.min(S.idx,frags().length-1)];
// Sequência: cada Ilha é uma cadeia ordenada; só o PONTO DE PARTIDA é aleatório (Ilha liberada + posição)
S.cur={};
function randomStart(){const p=phase(),el=ROOMS.filter(r=>r.phase<=p),r=rnd(el.length?el:ROOMS);S.room=r.id;S.idx=Math.floor(Math.random()*FRAG[r.id].length)}
randomStart();
// Revelações: fragmentos-chave longos (revelacoes.js), em ordem por Ilha; progresso lembrado entre visitas
S.special=null;S.sinceRev=0;S.revEvery=8+Math.floor(Math.random()*6);S.rev=store.get('rev',{});
function makeReveal(id,k){
  const list=(window.NEBULOSO_REVEALS||{})[id],room=ROOMS.find(r=>r.id===id);
  if(!list||!list.length||!room)return null;
  k=((k%list.length)+list.length)%list.length;
  return{icon:room.icon,m:list[k],d:[`Revelação ${k+1}/${list.length}`,`Ilha: ${room.name}`],t:'R',long:true,part:k+1,total:list.length,tag:`R-${String(ROOMS.indexOf(room)+1).padStart(2,'0')} REVELACAO_${k+1}`};
}
function nextReveal(id){
  const list=(window.NEBULOSO_REVEALS||{})[id];if(!list||!list.length)return null;
  const k=(S.rev[id]||0)%list.length;S.rev[id]=(S.rev[id]||0)+1;store.set('rev',S.rev);
  return makeReveal(id,k);
}

/* ---------- Controle temporal (etapa 1): histórico linear, LISTEN (pausa), UNDO ----------
   O rádio nunca para de receber. Estes controles só mexem em COMO você lê o que já chegou. */
const HIST_MAX=200,TREE_MAX=800;
const validEntry=e=>e&&FRAG[e.room]&&Number.isInteger(e.idx)&&e.idx>=0&&e.idx<FRAG[e.room].length&&e.ts&&typeof e.ts==='object';
/* Árvore de leitura (Plano B, fase B1). O histórico é um CAMINHO dentro de uma árvore de fragmentos vistos.
   Se você volta (UNDO) e depois segue por outro caminho, o futuro diverge do que já existia: nasce um RAMO (a, b, c…).
   Rótulo: T{fase}.{ponto}{ramo}, ex. T2.7b. Autoconsistência = quanto do caminho atual ainda está no ramo original ('a'). */
const brName=n=>String.fromCharCode(97+(n-1)%26)+(n>26?Math.floor((n-1)/26):'');
S.nodes=new Map();S.nid=0;S.brCount=1;S.count=0;
(function loadTree(){
  const t=store.get('arvore',null),h=store.get('historico',[]);
  if(t&&Array.isArray(t.nodes)){t.nodes.filter(n=>validEntry(n)&&Number.isInteger(n.id)).forEach(n=>{S.nodes.set(n.id,n);S.nid=Math.max(S.nid,n.id)});S.brCount=t.brCount||1}
  let prev=0;
  S.hist=(Array.isArray(h)?h.filter(validEntry).slice(-HIST_MAX):[]).map(e=>{     // caminho ativo: do mais antigo ao mais recente (o último = tela)
    let n=Number.isInteger(e.id)?S.nodes.get(e.id):null;
    if(!n){n=e;n.id=++S.nid;n.parent=prev;n.br=n.br||'a';S.nodes.set(n.id,n)}
    prev=n.id;return n});
})();
S.paused=false;S.pending=0;S.pendList=[];S.live=null;S.noHist=false;
S.fav=store.get('favorita',null);       // FAVORECER: só pesa o sorteio de SALTOS entre Ilhas; a cadeia de cada Ilha não muda
S.undos=0;S.bursts=0;S.locked=false;
// Arquivo: fragmentos SELADOS (só guarda; persistente). Guarda o texto, para não depender do banco.
const ARQ_MAX=500;
S.arq=(a=>Array.isArray(a)?a.filter(x=>x&&x.k&&typeof x.m==='string').slice(-ARQ_MAX):[])(store.get('arquivo',[]));
const keyOf=st=>st.room+'#'+st.idx+(st.special?'/R'+st.special.part:'');
const isSealed=()=>S.arq.some(a=>a.k===keyOf(S));
const entryFrom=(st,ts)=>({room:st.room,idx:st.idx,sp:st.special?st.special.part:0,at:Date.now(),ts});
function saveTree(){
  if(S.nodes.size>TREE_MAX){[...S.nodes.keys()].sort((a,b)=>a-b).slice(0,S.nodes.size-TREE_MAX).forEach(i=>S.nodes.delete(i))}
  store.set('arvore',{nodes:[...S.nodes.values()],brCount:S.brCount});store.set('historico',S.hist);
}
function pushHist(e){
  const tip=S.hist[S.hist.length-1];
  e.id=++S.nid;e.parent=tip?tip.id:0;
  const jaTemFuturo=!!tip&&[...S.nodes.values()].some(n=>n.parent===tip.id);
  e.br=!tip?'a':(jaTemFuturo?brName(++S.brCount):tip.br);        // seguir por outro caminho = novo ramo
  S.nodes.set(e.id,e);S.hist.push(e);
  if(S.hist.length>HIST_MAX)S.hist.splice(0,S.hist.length-HIST_MAX);
  S.count++;
  if(jaTemFuturo){log('branch',e.br);sweepSnd(700,350,.18)}
  if(typeof tapePush==='function')tapePush(e);
  saveTree();
}
// Deriva causal 0–100% (visível no rodapé): fase, rejeições, erros de transmissão e voltas no tempo
const drift=()=>Math.min(100,10*phase()+3*S.rejected+2*S.bursts+4*S.undos);
const tip=()=>S.hist[S.hist.length-1];
const cons=()=>S.hist.length?Math.round(100*S.hist.filter(n=>n.br==='a').length/S.hist.length):100;   // autoconsistência
const branchLabel=()=>`T${phase()}.${S.hist.length}${tip()?tip().br:'a'}`;
// visitar um ramo: o caminho ativo passa a ser o do nó escolhido (os nós antigos NÃO são reescritos)
function visit(id){
  if(S.locked){blocked();return}
  if(S.arriving)return;
  const n=S.nodes.get(id);if(!n||!validEntry(n))return;
  const path=[];let c=n,g=0;while(c&&g++<TREE_MAX){path.push(c);c=S.nodes.get(c.parent)}
  path.reverse();if(path.length>HIST_MAX)path.splice(0,path.length-HIST_MAX);
  if(!S.paused)pause();
  S.hist=path;S.room=n.room;S.idx=n.idx;S.special=n.sp?makeReveal(n.room,n.sp-1):null;S.ts=n.ts;S.seed=Math.random();S.tx='';
  S.undos++;store.set('historico',S.hist);sweepSnd(500,250,.2);log('visit_branch',n.br);
  S.noHist=true;render(true);S.noHist=false;paintRx();
}
// FAVORECER: marca a Ilha atual; aumenta a chance de um próximo SALTO cair nela
function toggleFav(){
  if(S.locked){blocked();return}
  const r=room();S.fav=(S.fav===S.room)?null:S.room;store.set('favorita',S.fav);
  S.tx=S.fav?`> ILHA FAVORITA: ${r.name}`:'> FAVORITA REMOVIDA';beep(S.fav?780:300,.07);log('favorite',S.fav);render();
}

function log(action,value){
  S.events.push({action,value,phase:phase(),timestamp:new Date().toISOString(),context:{last_island:ROOMS.findIndex(r=>r.id===S.room)+1,biometrics:{bpm:Math.round(S.bpm),cortisol:Math.round(S.cort)},time_in_app:Date.now()-S.t0,fragments_accepted:Object.keys(S.accepted).length,fragments_rejected:S.rejected}});
  if(S.events.length>200)S.events.shift();
  store.set('events',S.events);
}
window.NEBULOSO={state:S,events:()=>S.events,arquivo:()=>S.arq};

/* ================= TEXTO ================= */
const GL='▓▒░⚠◊※∴¥ƀ';
// PRNG com semente: as falhas de cada fragmento são fixas (o texto não "treme" sozinho)
function mkRng(seed){let a=Math.floor(seed*4294967296)>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
// Falhas por fase (fixas por fragmento): frase completa, com perdas pontuais
function degrade(t,p,tick,r){
  if(p===1)return t;
  return t.split('\n').map(l=>{
    if(p===2)return [...l].map(c=>c!==' '&&r()<.05?'☐':c).join('');
    if(p===3)return l.split(' ').map(w=>r()<.18?'▮▮'.repeat(Math.max(1,Math.ceil(w.length/3))):w).join(' ');
    return l.split(' ').map(w=>{const x=r();return x<.4?'░░░':x<.55?GL[(tick+w.length)%GL.length].repeat(Math.max(1,w.length)):w}).join(' ');
  }).join('\n');
}
// Erro de transmissão: rajada curta que corrompe algumas palavras e depois "retransmite"
function burstCorrupt(t,r){
  return t.split('\n').map(l=>l.split(' ').map(w=>w.length>2&&r()<.3?(r()<.5?'▮'.repeat(w.length):[...w].map(()=>GL[Math.floor(r()*GL.length)]).join('')):w).join(' ')).join('\n');
}
const bursting=()=>Date.now()<S.burstUntil;
// Deriva LINGUÍSTICA (degradacao.js): eixo à parte da fase/deriva causal. Ilha + horas de leitura + erros;
// F1–F4 (debug) fixam a camada para teste. Revelações ficam uma camada abaixo (precisam continuar legíveis).
function langInfo(){
  if(typeof LANG==='undefined')return{drift:0,layer:{id:'pt',code:'PT',name:'Português'}};
  const ilhaN=ROOMS.findIndex(x=>x.id===S.room)+1,horas=S.hours+(Date.now()-S.t0)/36e5;
  const d=LANG.drift(ilhaN,horas,S.bursts,S.override);
  return{drift:d,layer:LANG.layerFor(d)};
}
function currentLangLayer(){
  const li=langInfo();let d=li.drift;
  if(frag().long)d=Math.max(0,d-33);
  return{drift:d,layer:typeof LANG==='undefined'?li.layer:LANG.layerFor(d)};
}
function buildText(){
  const p=phase(),f=frag(); let t=f.m;
  if(p===4&&!f.long){ // fragmentos de múltiplas Ilhas simultâneos (linha de outra Ilha, fixa por fragmento)
    const r0=mkRng(S.seed+.137),oi=ROOMS[Math.floor(r0()*ROOMS.length)].id,of=FRAG[oi];
    t+='\n'+of[Math.floor(r0()*of.length)].m.split('\n')[0];
  }
  // A camada de linguagem (EN/RU/GR/símbolo) NÃO entra no texto principal — ele fica sempre em português.
  // Ela aparece só como legenda pequena abaixo (ver render()/#tr).
  // revelação chega com mais clareza: degrada um nível abaixo da fase (o enredo precisa ser lido)
  const pd=f.long?Math.max(1,p-1):p;
  t=degrade(t,pd,S.tick,mkRng(S.seed+pd*.001));
  if(bursting())t=burstCorrupt(t,mkRng(S.burstSeed+Math.floor(Date.now()/150)*.0001));
  return t;
}
const footText=()=>{
  if(bursting())return '⚠ ERRO DE TRANSMISSÃO | retransmitindo…';
  const cl=currentLangLayer(),lang=cl.layer.id!=='pt'?`${cl.layer.code} ${Math.round(cl.drift)}% | `:'';
  return `${lang}${S.paused?`⏸ +${S.pending} | `:''}${S.special?`REV ${S.special.part}/${S.special.total} | `:''}${branchLabel()} | CONS ${cons()}% | DER ${drift()}%`;
};

/* ================= NAVEGAÇÃO ================= */
function pickRoom(from=S.room){
  const p=phase(); let el=ROOMS.filter(r=>r.phase<=p);
  if(Math.random()<.3) el=ROOMS; // 30% causalidade quebrada (handoff: até 40% via SYNC)
  const w=el.map(r=>r.id===from?.5:(r.id===S.fav?3:1));   // favorita pesa 3× no sorteio de salto
  let x=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<el.length;i++){x-=w[i];if(x<=0)return el[i].id}
  return el[0].id;
}
// go: entra numa Ilha retomando de onde parou (ou num ponto aleatório se for a primeira vez)
function go(id,i){S.special=null;S.room=id;S.idx=(i!==undefined)?i:(S.cur[id]!==undefined?S.cur[id]:Math.floor(Math.random()*FRAG[id].length));S.seed=Math.random();S.ts=impossibleStamp();S.tx='';resetCountdown();render(true)}
// next: avança UM passo na cadeia; raramente (12%) a "causalidade quebra" e salta para outra Ilha
function next(kind='next'){
  // de tempos em tempos (a cada ~16–28 fragmentos) chega uma REVELAÇÃO longa da Ilha atual
  if(!S.special&&++S.sinceRev>=S.revEvery){
    const rv=nextReveal(S.room);
    if(rv){S.special=rv;S.sinceRev=0;S.revEvery=16+Math.floor(Math.random()*13);S.seed=Math.random();S.ts=impossibleStamp();S.tx='';resetCountdown();render(true);return}
  }
  S.special=null;
  // SYNC tem mais chance de "causalidade quebrada" (salto de Ilha) que o avanço normal — é a diferença entre os dois
  if(Math.random()<(kind==='sync'?.4:.12)){const id=pickRoom(); if(id!==S.room)return go(id);}
  S.idx=(S.idx+1)%frags().length;S.seed=Math.random();S.ts=impossibleStamp();resetCountdown();
  S.bpm=clamp(S.bpm+1+Math.random()*4,0,130);
  render(true);
}
function prev(){if(S.special){S.special=null;S.seed=Math.random();S.ts=impossibleStamp();render(true);return}S.idx=(S.idx-1+frags().length)%frags().length;S.seed=Math.random();S.ts=impossibleStamp();render(true)}
const hub=()=>{beep(220,.06);setTimeout(()=>beep(330,.06),80);S.paused=false;S.locked=false;S.live=null;S.pending=0;S.pendList=[];randomStart();go(S.room,S.idx)};   // HUB = novo início aleatório (encerra pausa)
const cycle=()=>go(ROOMS[(ROOMS.findIndex(r=>r.id===S.room)+1)%ROOMS.length].id);
function reject(){S.rejected++;store.set('rejected',S.rejected);S.bpm+=10;log('fragment_rejected',S.idx)}

/* ================= RENDER ================= */
const TINT={1:'#00FF00',2:'#B4FF00',3:'#FF6347',4:'#FF00FF'};
const SCAN=[.12,.25,.45,.7];
function render(animate){
  const p=phase(),r=room(),f=frag();
  S.cur[S.room]=S.idx;
  if(animate&&!S.noHist)pushHist(entryFrom(S,S.ts));   // cada fragmento exibido entra no histórico linear
  document.querySelector('.box').classList.toggle('chave',!!f.long);
  const cont=$('#content'); cont.className='content p'+p;
  document.documentElement.style.setProperty('--tint',TINT[p]);
  applySliderFX();   // SCAN e BRGT têm função real (ver definição perto dos sliders): recalcula com a fase atual
  $('#room').textContent=r.name+(S.fav===r.id?' ★':'');
  $('#stamp').textContent=`${S.ts.sent} | ${S.ts.clock} | FASE: ${p}`;
  $('#ic').textContent=f.icon;
  const t=$('#txt'); t.textContent=buildText()+(S.accepted[S.room+S.idx]?'':'');
  t.classList.toggle('glitch',p===4&&!REDUCED);
  // legenda pequena: a camada de linguagem (grego/cirílico/inglês/símbolo), abaixo do texto em PT
  const cl=currentLangLayer(),trEl=$('#tr');
  if(typeof LANG!=='undefined'&&cl.layer.id!=='pt'){
    trEl.hidden=false;trEl.innerHTML='';
    const b=document.createElement('b');b.textContent=`${cl.layer.name} · ${Math.round(cl.drift)}%`;
    trEl.appendChild(b);trEl.appendChild(document.createTextNode(LANG.render(f.m,cl.layer,mkRng(S.seed+9))));
  }else{trEl.hidden=true;trEl.textContent=''}
  $('#tx').textContent=S.tx;$('#tx').style.display=S.tx?'block':'none';
  $('#lines').innerHTML=f.d.map(l=>`<div>${l}</div>`).join('');
  $('#meta').innerHTML=`${f.tag} | enviado: ${S.ts.sent} | lido: ${S.ts.read} | criado: ${S.ts.made}<br>origem: desconhecida | leitura: ${S.ts.mark}${S.accepted[S.room+S.idx]?' | <span class="acc">ACEITO</span>':''}${isSealed()?' | <span class="acc">SELADO</span>':''}`;
  $('#foot').textContent=footText();
  if(animate)$('#srtxt').textContent=f.m.replace(/\.\.\./g,'').replace(/\n/g,'. ');   // leitor de tela recebe o texto LIMPO (as falhas são só visuais)
  if(typeof panelsRefresh==='function')panelsRefresh();
  if(animate){const b=document.querySelector('.box');b.classList.remove('fadein');void b.offsetWidth;b.classList.add('fadein');$('#scroll').scrollTop=0}
  document.querySelectorAll('.dbg button').forEach(b=>b.classList.toggle('on',+b.dataset.p===p&&!!S.override||b.dataset.p==='A'&&!S.override));
  renderLeds(p);
  $('#sync').classList.toggle('osc',p===3);
  $('#toggle').classList.toggle('g',p===4);
}
function renderLeds(p){
  const on=[10,8,5,3][p-1],warn=p>=2?1:0,err=p>=3?p-2:0;
  $('#leds').innerHTML=Array.from({length:10},(_,i)=>{
    let c='led';
    if(i<err)c+=p===4?' mag fast':' err blink';
    else if(i<err+warn)c+=' warn blink';
    else if(i<on)c+=p===4?' mag fast':p===3?' err blink':' on'+(p===2&&i%3===0?' blink':'');
    return `<div class="${c}"></div>`}).join('');
}
// Biometria por Ilha: cada uma tem um estado coerente com seu tema (culpa, vazio, medo, invasão...).
// A fase controla só a instabilidade (o quanto oscila em torno do alvo da Ilha), nunca o tema em si.
const MOOD={
  validacao_falsaria:  {bpm:82, cort:38, temp:36.5,vr:1.0},  // culpa — tenso, contido
  ausencia_registrada: {bpm:64, cort:28, temp:36.0,vr:.6},   // vazio — numb
  predicao_invertida:  {bpm:102,cort:48, temp:36.7,vr:1.3},  // medo
  corpo_monitorado:    {bpm:88, cort:40, temp:36.4,vr:1.6},  // invasão — hipervigilante
  mae_variavel:        {bpm:85, cort:42, temp:36.4,vr:1.0},  // responsabilidade
  trabalho_morte:      {bpm:68, cort:30, temp:36.2,vr:.5},   // dissociação — mecânico
  sua_mensagem:        {bpm:80, cort:36, temp:36.4,vr:1.1},  // recursão — oscila
  app_proposito:       {bpm:105,cort:50, temp:36.6,vr:1.8},  // horror — picos
  multiplas_realidades:{bpm:90, cort:44, temp:36.5,vr:2.2},  // dispersão — errático
  falha_irrecuperavel: {bpm:95, cort:52, temp:36.8,vr:1.4},  // desespero
  sem_saida:           {bpm:118,cort:55, temp:37.0,vr:1.3},  // sufocamento
  nunca_existisse:     {bpm:58, cort:25, temp:35.8,vr:.4},   // nada — quase parado
};
function renderLive(){
  const p=phase(),m=MOOD[S.room]||{bpm:75,cort:35,temp:36.4,vr:1};
  const k=[.03,.05,.08,.14][p-1],noise=[6,10,16,26][p-1]*m.vr*.14;
  S.bpm=clamp(S.bpm+(m.bpm-S.bpm)*k+(Math.random()-.5)*noise,45,150);
  S.cort=clamp(S.cort+(m.cort-S.cort)*k+(Math.random()-.5)*noise*.5,15,70);
  // temperatura fica com precisão total internamente; só arredonda na exibição (arredondar a cada tick travava o valor)
  S.temp=clamp(S.temp+(m.temp-S.temp)*k*.6+(Math.random()-.5)*noise*.01,34.5,38.2);
  $('#live').textContent=p===4&&Math.random()<.3?`BPM: ${Math.round(S.bpm)}  Cort: ${GL[S.tick%GL.length]}${GL[(S.tick+3)%GL.length]}  T: --`:`BPM: ${Math.round(S.bpm)}  Cort: ${Math.round(S.cort)}  T: ${S.temp.toFixed(1)}°C`;
}

dbg.onclick=e=>{const b=e.target.closest('button');if(!b)return;sweepSnd(200,1300,.3);S.override=b.dataset.p==='A'?null:+b.dataset.p;log('phase_override',b.dataset.p);render()};

// sliders
const SL=[['scan','SCAN','#00FF00'],['brgt','BRGT','#FFFF00'],['sgnl','SGNL','#00CED1']];
$('#sliders').innerHTML=SL.map(([k,l,c])=>`<div class="sl"><div class="track" data-k="${k}" role="slider" tabindex="0" aria-label="${l}" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="thumb" style="background:${c};border-color:${c}"></div></div><label>${l}</label></div>`).join('');
// SCAN e BRGT têm função REAL, em tempo real (não são só decorativos):
//  SCAN = intensidade das scanlines, por cima do piso da fase (a fase nunca é enfraquecida, só reforçada)
//  BRGT = brilho real da tela (filtro CSS), 0 = quase apagada, 100 = ofuscante
//  SGNL já tinha função real (velocidade de recepção); continua como está
function applySliderFX(){

}
function paintSliders(){SL.forEach(([k])=>{const t=document.querySelector(`.track[data-k=${k}]`);t.querySelector('.thumb').style.bottom=`calc(${S.sl[k]}% - ${S.sl[k]*.1}px)`;t.classList.toggle('locked',S.lock[k]>Date.now());t.setAttribute('aria-valuenow',S.sl[k])});applySliderFX()}
// teclado nos sliders: setas ±5, Home/End
document.querySelectorAll('.track').forEach(t=>t.addEventListener('keydown',e=>{

  if(e.key==='Home'||e.key==='End'){S.sl[k]=e.key==='Home'?0:100}
  else if(d!==undefined){if(S.lock[k]>Date.now())return;S.sl[k]=clamp(S.sl[k]+d,0,100)}else return;
  e.preventDefault();paintSliders();log('slider_change',k+':'+S.sl[k])}));
document.querySelectorAll('.track').forEach(t=>{
  const k=t.dataset.k;
  const set=e=>{if(S.lock[k]>Date.now())return;const r=t.getBoundingClientRect();const v=Math.round(clamp((r.bottom-e.clientY)/r.height*100,0,100));if(v!==S.sl[k]){S.sl[k]=v;paintSliders();log('slider_change',k+':'+v)}};

});

// SYNC: toque = próximo (rejeita) | segurar 0,5s + 2s = aceitar
const sync=$('#sync');let holdT,raf,holdStart,holding=false,pressed=false;
function setHold(v){document.documentElement.style.setProperty('--hold',v)}
sync.onpointerdown=e=>{e.preventDefault();pressed=true;holding=false;try{sync.setPointerCapture(e.pointerId)}catch(_){}
  holdT=setTimeout(()=>{holding=true;holdStart=performance.now();
    const cap=phase()===4?.9:1;
    raf=setInterval(()=>{const v=Math.min(1,(performance.now()-holdStart)/2000);setHold(Math.min(v,cap));if(v>=1||!pressed)clearInterval(raf)},30)},500)};
sync.onpointerup=sync.onpointercancel=()=>{
  if(!pressed)return;pressed=false;clearTimeout(holdT);clearInterval(raf);
  if(holding){
    const v=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hold'))||0;
    if(v>=.99){S.accepted[S.room+S.idx]=1;log('fragment_accepted',S.idx);sync.classList.add('grn');setTimeout(()=>sync.classList.remove('grn'),300);beep(880,.12);S.bpm+=2;render()}
    else if(phase()===4&&v>=.89){$('#tx').style.display='block';$('#tx').textContent='> ACEITAÇÃO NEGADA: sinal insuficiente';beep(120,.25)}
    setHold(0);
  }else syncTap();
};
function syncTap(){
  if(S.locked){blocked();return}
  log('button_click','sync');reject();
  sync.classList.add('red');beep(440,.05);
  const d=phase()>=2?300:phase()===1?60:300;
  setTimeout(()=>{sync.classList.remove('red');sync.classList.add('grn');next('sync');setTimeout(()=>sync.classList.remove('grn'),200)},d);
}
// teclado no SYNC: Enter/Espaço = próximo; Shift+Enter = aceitar (na fase 4 o aceite é negado, como no toque longo)
sync.onkeydown=e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;e.preventDefault();
  if(e.shiftKey){if(phase()===4){$('#tx').style.display='block';$('#tx').textContent='> ACEITAÇÃO NEGADA: sinal insuficiente';beep(120,.25)}
    else{S.accepted[S.room+S.idx]=1;log('fragment_accepted',S.idx);beep(880,.12);S.bpm+=2;render()}}
  else syncTap();
};

/* ================= RECEPÇÃO AUTOMÁTICA (rádio: só se recebe, nunca se envia) ================= */
// sinal / estabilidade por tipo de fragmento (A direto ... E criptografado)
const TYPE_SIGNAL={R:[95,90],A:[90,80],B:[70,60],C:[50,40],D:[60,50],E:[30,20]};
const mmss=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
// Troca lenta: 30–50 s entre fragmentos (−3 s por fase). SGNL baixo = transmissão ainda mais lenta.
function resetCountdown(sp=S.special){S.nextIn=Math.round((30+Math.random()*20-(phase()-1)*3)*(1.4-S.sl.sgnl/250))+(sp?30:0);paintRx()}   // revelação longa: +30 s para ler
// Botão LISTEN mostra o estado: contagem até a próxima chegada, "RECEBENDO" ou "PAUSA +N novos"
function paintRx(){
  const rx=$('#rx');
  rx.innerHTML=S.paused?`<b>PAUSA</b><i>+${S.pending} novos</i>`:S.arriving?`<b>RECEBENDO</b><i>…</i>`:`<b>LISTEN</b><i>${mmss(S.nextIn)}</i>`;
  const b=$('#listen');b.classList.toggle('on',S.paused);b.setAttribute('aria-pressed',S.paused);
  const lb=$('#lock');lb.classList.toggle('lk',S.locked);lb.textContent=S.locked?'TRAVADO':'LOCK';lb.setAttribute('aria-pressed',S.locked);
}
// LISTEN: pausa a LEITURA (a tela congela). O rádio continua recebendo e empilha os fragmentos.
function pause(){
  if(S.paused)return;
  S.paused=true;S.pending=0;S.pendList=[];
  S.live={room:S.room,idx:S.idx,special:S.special,sinceRev:S.sinceRev,revEvery:S.revEvery};   // "cabeça" do fluxo real
  sweepSnd(520,240,.16);log('listen_pause');paintRx();$('#foot').textContent=footText();
}
function resume(){
  if(!S.paused)return;
  const L=S.live;S.paused=false;S.locked=false;sweepSnd(240,620,.16);log('listen_resume',S.pending);
  if(S.pending){
    S.pendList.forEach(pushHist);                                   // o que chegou na pausa entra no histórico, em ordem
    S.room=L.room;S.idx=L.idx;S.special=L.special;S.sinceRev=L.sinceRev;S.revEvery=L.revEvery;
    S.seed=Math.random();S.ts=S.pendList[S.pendList.length-1].ts;S.tx='';
  }
  S.live=null;S.pending=0;S.pendList=[];resetCountdown();
  S.noHist=true;render(true);S.noHist=false;paintRx();           // salta para a chegada mais recente
}
// Chegada durante a pausa: avança a "cabeça" do fluxo sem tocar na tela
function stepLive(){
  const L=S.live;
  if(!L.special&&++L.sinceRev>=L.revEvery){const rv=nextReveal(L.room);if(rv){L.special=rv;L.sinceRev=0;L.revEvery=16+Math.floor(Math.random()*13);return}}
  L.special=null;
  if(Math.random()<.12){const id=pickRoom(L.room);if(id!==L.room){L.room=id;L.idx=S.cur[id]!==undefined?S.cur[id]:Math.floor(Math.random()*FRAG[id].length);return}}
  L.idx=(L.idx+1)%FRAG[L.room].length;
}
function silentArrive(){
  stepLive();S.pending++;beep(900,.02,'square',.006);   // chegada em silêncio: só um estalo fraco
  const e=entryFrom(S.live,impossibleStamp());S.pendList.push(e);
  log('fragment_received',`${e.room}#${e.idx}${e.sp?'/R'+e.sp:''}`);
  resetCountdown(S.live.special);$('#foot').textContent=footText();
}
// UNDO: volta ao fragmento realmente visto antes (histórico, inclusive saltos de Ilha). Entra em pausa: o rádio segue recebendo.
// LOCK: trava o fragmento na tela. É uma pausa mais forte: enquanto travado, nada muda a tela (nem ANTERIOR, PRÓXIMO, UNDO ou SYNC).
// O rádio segue recebendo em silêncio. Destravar (LOCK ou LISTEN de novo) salta para a chegada mais recente.
function blocked(){S.tx='> TRAVADO: destrave para navegar';render()}
function lock(){
  if(S.arriving)return;
  if(S.locked){resume();return}
  if(!S.paused)pause();
  S.locked=true;S.tx='> FRAGMENTO TRAVADO';beep(150,.12,'sawtooth');log('lock');paintRx();render();
}
// SEAL: sela o fragmento no Arquivo (só guarda). Na fase 4 o selo pode falhar, de propósito.
function seal(){
  if(phase()===4&&Math.random()<.4){S.tx='> SELO NEGADO: sinal insuficiente';beep(120,.25);log('seal_denied');render();return}
  const k=keyOf(S);
  if(isSealed()){S.tx=`> JÁ SELADO (${S.arq.length} no Arquivo)`;render();return}
  S.arq.push({k,room:S.room,idx:S.idx,sp:S.special?S.special.part:0,at:Date.now(),ts:S.ts,m:frag().m});
  if(S.arq.length>ARQ_MAX)S.arq.shift();
  store.set('arquivo',S.arq);S.tx=`> SELADO no Arquivo (${S.arq.length})`;beep(660,.08);log('seal',k);render();
}
function undo(){
  if(S.locked){blocked();return}
  if(S.arriving)return;
  if(S.hist.length<2){S.tx='> UNDO: sem histórico anterior';render();return}
  if(!S.paused)pause();
  S.hist.pop();const e=S.hist[S.hist.length-1];
  if(!validEntry(e)){store.set('historico',S.hist);return}
  S.room=e.room;S.idx=e.idx;S.special=e.sp?makeReveal(e.room,e.sp-1):null;S.ts=e.ts;S.seed=Math.random();S.tx='';
  S.undos++;store.set('historico',S.hist);sweepSnd(950,170,.24);log('undo');   // "rebobinar"
  S.noHist=true;render(true);S.noHist=false;paintRx();
}
function arrive(){
  S.arriving=true;const rx=$('#rx'),leds=$('#leds');
  rx.classList.add('arriving');leds.classList.add('rxing');paintRx();
  sweepSnd(300,950,.6);                 // sintonizando
  setTimeout(()=>{
    next('auto');                       // fragmento chega sozinho
    if(frag().long){beep(520,.09);setTimeout(()=>beep(780,.13),120)}   // revelação: dois tons
    else beep(TYPE_HZ[frag().t]||500,.07,frag().t==='E'?'sawtooth':'square');   // tom por tipo de fragmento
    const [sg,st]=TYPE_SIGNAL[frag().t]||[50,40],p=phase();
    // o rádio se sintoniza sozinho: sliders seguem o "sinal" do tipo (respeitando travas)
    if(S.lock.sgnl<Date.now())S.sl.sgnl=clamp(sg-(p-1)*8+Math.round(Math.random()*6),0,100);
    if(S.lock.scan<Date.now())S.sl.scan=clamp(st-(p-1)*6+Math.round(Math.random()*6),0,100);
    if(S.lock.brgt<Date.now())S.sl.brgt=clamp(S.sl.brgt+(Math.random()>.5?4:-4),10,100);
    paintSliders();
    sync.classList.add('grn');setTimeout(()=>sync.classList.remove('grn'),300);
    log('fragment_received',frag().tag);
    setTimeout(()=>{S.arriving=false;rx.classList.remove('arriving');leds.classList.remove('rxing');paintRx()},900);
  },phase()>=3?1800:1400);   // sintonização mais demorada
}
setInterval(()=>{
  if(S.standby||S.arriving)return;
  S.nextIn--;
  if(S.paused){if(S.nextIn<=0)silentArrive();paintRx();return}   // pausado: o rádio segue recebendo, em silêncio
  paintRx();if(S.nextIn<=0)arrive();
},1000);
$('#listen').onclick=()=>{if(S.arriving)return;log('button_click','listen');S.paused?resume():pause()};
$('#undo').onclick=()=>{log('button_click','undo');undo()};
$('#lock').onclick=()=>{log('button_click','lock');lock()};

/* ================= ÁUDIO: estática leve + bipes distorcidos (sempre baixo), ligados à tela e às funções =================
   - só inicia após o primeiro toque/tecla (regra dos navegadores) e nunca passa de um teto de volume
   - o ruído acompanha a FASE, o SGNL, a varredura da tela, a chegada, as rajadas de erro, a pausa e o LOCK
   - standby silencia tudo; aba em segundo plano também */
const AU={ctx:null};
const VOL={master:.5,noise:[.006,.010,.016,.024],cap:.05,beep:.028,tick:.009,pop:.014};
function distCurve(k){const n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(3+k)*x*20*Math.PI/180/(Math.PI+k*Math.abs(x))}return c}
function audioInit(){
  if(AU.ctx)return;
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    const ctx=new C(),master=ctx.createGain(),comp=ctx.createDynamicsCompressor();
    master.gain.value=VOL.master;comp.threshold.value=-30;comp.ratio.value=8;master.connect(comp);comp.connect(ctx.destination);
    // ruído: 2 s de ruído branco levemente suavizado, em laço
    const len=ctx.sampleRate*2,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);let last=0;
    for(let i=0;i<len;i++){last=last*.35+(Math.random()*2-1)*.65;d[i]=last}
    const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;
    const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=900;
    const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=3200;bp.Q.value=.5;
    const ng=ctx.createGain();ng.gain.value=0;
    src.connect(hp);hp.connect(bp);bp.connect(ng);ng.connect(master);src.start();
    // zumbido de tubo catódico (60 Hz, quase inaudível)
    const hum=ctx.createOscillator(),hg=ctx.createGain();hum.type='sine';hum.frequency.value=60;hg.gain.value=.0035;hum.connect(hg);hg.connect(master);hum.start();
    // distorção compartilhada pelos bipes
    const shaper=ctx.createWaveShaper();shaper.curve=distCurve(60);shaper.oversample='2x';shaper.connect(master);
    Object.assign(AU,{ctx,master,ng,bp,hg,shaper});
    audioLoop();scheduleCrackle();musicInit();
  }catch(e){AU.ctx=null}
}
// posição (0–1) da faixa de varredura da tela (CSS .sweep, ciclo de 8 s): o ruído "passa" junto com ela
function sweepPos(){try{const a=document.querySelector('.sweep').getAnimations()[0],t=a&&a.currentTime!=null?Number(a.currentTime):performance.now();return(t%8000)/8000}catch(e){return(performance.now()%8000)/8000}}
function audioLoop(){
  setInterval(()=>{
    if(!AU.ctx)return;const c=AU.ctx,t=c.currentTime;
    musicTick();   // sempre roda: ela mesma decide mutar (standby/aba oculta) — antes do "return" abaixo, senão fica preso no volume anterior
    if(document.hidden||S.standby){AU.ng.gain.setTargetAtTime(0,t,.1);AU.hg.gain.setTargetAtTime(0,t,.1);return}
    if(c.state==='suspended')c.resume().catch(()=>{});
    const p=phase();let g=VOL.noise[p-1],f=3200;
    g*=1+(100-S.sl.sgnl)/150;                                            // SGNL baixo = mais estática
    const bump=Math.exp(-Math.pow((sweepPos()-.5)*7,2));g*=1+.8*bump;   // a varredura da tela passa = "shhh"
    if(S.locked){g*=.35;f=1100}else if(S.paused){g*=.55;f=1800}          // travado/pausado: abafado
    if(S.arriving){g*=2.2;f=1200+((performance.now()/1400)%1)*4200}     // sintonização: o filtro varre
    if(bursting()){g*=3.2;f=5200}                                        // erro de transmissão: estática forte
    if(S.special&&!S.paused)g*=.8;                                       // revelação chega mais limpa
    g=Math.min(g,VOL.cap);
    AU.ng.gain.setTargetAtTime(g,t,.06);AU.bp.frequency.setTargetAtTime(f,t,.08);
    AU.hg.gain.setTargetAtTime(.0035*(1+.5*p/4)*(1+bump*.3),t,.2);
    musicTick();
  },200);
}
// estalos ocasionais (mais frequentes a cada fase)
function scheduleCrackle(){setTimeout(()=>{if(AU.ctx&&!S.standby&&!document.hidden)pop();scheduleCrackle()},(3200-phase()*550)*(.4+Math.random()*1.2))}
function pop(){
  const c=AU.ctx,n=Math.floor(c.sampleRate*.012),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource(),g=c.createGain();g.gain.value=VOL.pop*(S.locked?.4:1);s.buffer=b;s.connect(g);g.connect(AU.master);s.start();
}
// bipe distorto e levemente desafinado; volume sempre baixo
function beep(f=440,d=.08,type='square',vol=VOL.beep){
  if(!AU.ctx||S.standby)return;
  try{const c=AU.ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.linearRampToValueAtTime(f*(.94+Math.random()*.12),t+d);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(Math.min(vol,VOL.cap),t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AU.shaper);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
function sweepSnd(f0,f1,d=.25,vol=.022){   // varredura de tom (sintonizar, pausar, rebobinar, ligar/desligar)
  if(!AU.ctx||S.standby)return;
  try{const c=AU.ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(Math.min(vol,VOL.cap),t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AU.shaper);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
/* ================= MÚSICA SINTETIZADA (clima de referência — SEM nenhum sample, trecho ou melodia de obra
   de terceiros: só osciladores próprios, em escala e ritmo autorais)
   Referência de humor usada (não copiada): "Maasai" (Surma, 2016) — synth pads oníricos, voz frágil,
   loops hipnóticos, cordas nas transições, ruído sutil de fundo, ~80–90 BPM, dinâmica suave→média→suave.
   Aqui: acorde-pad sustentado (a "voz" vira acorde, não voz), loop de 4 notas com eco (déjà vu), cordas
   nas transições de Ilha/camada de linguagem, e um batimento suave no BPM real de Alex (S.bpm).
   Tudo por cima do teto de volume já existente (VOL.cap = 0,05); nunca é a única coisa tocando. ================= */
const midiHz=n=>440*Math.pow(2,(n-69)/12);
const MSCALE=[50,52,53,55,57,59,60];              // Ré dórico grave (D3 dorian) — quente, levemente melancólico
function hashStr(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
const chordFor=id=>{const r=MSCALE[hashStr(id)%MSCALE.length];return[r,r+3,r+7]};   // tríade: fundamental, terça menor, quinta
const VOLM={pad:.018,loop:.012,string:.016,pulse:.008};
const MU={pad:null,loop:null,lastRoom:null,lastLayer:null};

function musicPadStart(){
  if(MU.pad||!AU.ctx)return;
  const c=AU.ctx,g=c.createGain(),lp=c.createBiquadFilter();
  lp.type='lowpass';lp.frequency.value=1100;lp.Q.value=.3;
  g.gain.value=0;g.connect(lp);lp.connect(AU.master);
  const oscs=chordFor(S.room).map((n,i)=>{
    const o=c.createOscillator(),og=c.createGain();
    o.type=i===0?'triangle':'sine';o.frequency.value=midiHz(n);og.gain.value=i===0?1:.6;
    o.connect(og);og.connect(g);o.start();return o;
  });
  const lfo=c.createOscillator(),lg=c.createGain();          // "respiração" lenta do pad
  lfo.frequency.value=.07;lg.gain.value=VOLM.pad*.3;lfo.connect(lg);lg.connect(g.gain);lfo.start();
  g.gain.setTargetAtTime(VOLM.pad,c.currentTime,4);          // entra devagar (~4s)
  MU.pad={oscs,gain:g};MU.lastRoom=S.room;
}
function musicPadRetune(){
  if(!MU.pad)return;
  const c=AU.ctx,chord=chordFor(S.room);
  MU.pad.oscs.forEach((o,i)=>o.frequency.setTargetAtTime(midiHz(chord[i]),c.currentTime,3));   // glissando de 3s
}
function musicPluck(dest,freq,dur){
  const c=AU.ctx,o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.value=freq;
  g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(1,c.currentTime+.06);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);
  o.connect(g);g.connect(dest);o.start();o.stop(c.currentTime+dur+.05);
}
// loop hipnótico: só soa nas Ilhas tardias (fase 3+), num ramo divergente (déjà vu) ou com deriva alta
const musicLoopActive=()=>phase()>=3||(typeof tip==='function'&&tip()&&tip().br!=='a')||(typeof drift==='function'&&drift()>=55);
function musicLoopStart(){
  if(MU.loop||!AU.ctx)return;
  const c=AU.ctx,delay=c.createDelay(1.2),fb=c.createGain(),g=c.createGain(),dry=c.createGain();
  delay.delayTime.value=.45;fb.gain.value=.3;delay.connect(fb);fb.connect(delay);
  dry.gain.value=1;dry.connect(delay);dry.connect(g);delay.connect(g);g.gain.value=0;g.connect(AU.master);
  MU.loop={dry,g,step:0,timer:0};
  musicLoopStep();
}
function musicLoopStep(){
  if(!MU.loop)return;
  const active=musicLoopActive()&&!S.standby&&!document.hidden;
  MU.loop.g.gain.setTargetAtTime(active?VOLM.loop:0,AU.ctx.currentTime,1.5);
  if(active){const chord=chordFor(S.room);musicPluck(MU.loop.dry,midiHz(chord[MU.loop.step%chord.length]+12),.9);MU.loop.step++}
  MU.loop.timer=setTimeout(musicLoopStep,active?700:2500);
}
// cordas: um breve "swell" ao mudar de Ilha ou de camada de linguagem (marca a transição, como no clima de referência)
function musicStringSwell(){
  if(!AU.ctx||S.standby)return;
  const c=AU.ctx,chord=chordFor(S.room),lp=c.createBiquadFilter(),g=c.createGain();
  lp.type='lowpass';lp.frequency.value=900;lp.Q.value=.5;
  g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(VOLM.string,c.currentTime+1.3);g.gain.linearRampToValueAtTime(0,c.currentTime+4);
  lp.connect(g);g.connect(AU.master);
  chord.forEach((n,i)=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=midiHz(n+12)*(1+(i-1)*.003);o.connect(lp);o.start();o.stop(c.currentTime+4.1)});
}
// batimento suave, no BPM real de Alex (S.bpm): percussão discreta, não um click
function musicPulseStep(){
  if(AU.ctx&&!S.standby&&!document.hidden&&AU.ctx.state==='running'){
    const c=AU.ctx,n=Math.floor(c.sampleRate*.09),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++){const env=Math.exp(-i/(n*.25));d[i]=Math.sin(i/c.sampleRate*2*Math.PI*68)*env*.8+(Math.random()*2-1)*env*.3}
    const s=c.createBufferSource(),lp=c.createBiquadFilter(),g=c.createGain();
    lp.type='lowpass';lp.frequency.value=170;g.gain.value=VOLM.pulse*(S.locked?.3:1);
    s.buffer=b;s.connect(lp);lp.connect(g);g.connect(AU.master);s.start();
  }
  setTimeout(musicPulseStep,Math.max(420,60000/(S.bpm||75)));
}
function musicTick(){                            // roda junto do audioLoop (200ms): acompanha Ilha e camada de linguagem
  if(!AU.ctx)return;
  if(S.room!==MU.lastRoom){musicPadRetune();if(MU.lastRoom)musicStringSwell();MU.lastRoom=S.room}
  const lid=typeof currentLangLayer==='function'?currentLangLayer().layer.id:'pt';
  if(lid!==MU.lastLayer){if(MU.lastLayer)musicStringSwell();MU.lastLayer=lid}
  if(MU.pad)MU.pad.gain.gain.setTargetAtTime((S.standby||document.hidden)?0:VOLM.pad,AU.ctx.currentTime,.8);
}
function musicInit(){musicPadStart();musicLoopStart();musicPulseStep()}

const TYPE_HZ={A:660,B:560,C:480,D:420,E:300};
document.addEventListener('pointerdown',audioInit,{once:true});
document.addEventListener('keydown',audioInit,{once:true});
// clique de qualquer botão/controle: estalo curto (o SYNC tem som próprio)
document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('button,.toggle,.track');if(b&&b.id!=='sync')beep(1800,.018,'square',VOL.tick)},true);

/* ================= LOCALIZAÇÃO (só em memória, nunca gravada nem enviada) ================= */
S.loc=null;S.locState='idle';
function fmtCoord(v,pos,neg){return Math.abs(v).toFixed(4)+'°'+(v>=0?pos:neg)}
function renderLoc(){
  const el=$('#loc');
  if(S.locState==='denied'){el.textContent='LOC: SINAL BLOQUEADO';return}
  if(S.locState==='unsupported'){el.textContent='LOC: SEM SENSOR';return}
  if(!S.loc){el.textContent='LOC: aguardando sinal...';return}
  let s=`LOC: ${fmtCoord(S.loc.lat,'N','S')} ${fmtCoord(S.loc.lon,'L','O')} ±${Math.round(S.loc.acc)}m`;
  if(phase()===4){s=s.replace(/\d/g,c=>Math.random()<.15?GL[Math.floor(Math.random()*GL.length)]:c)} // fase 4: coordenadas corrompidas
  el.textContent=s;
}
// LOC ORIGEM: coordenadas de onde o sinal parte (São Paulo), fixas — não são as do leitor; corrompem junto na fase 4
function renderLocOrigin(){
  const el=$('#locOrigin');if(!el)return;
  let s='ORIGEM: 23.5505°S 46.6333°O · SÃO PAULO';
  if(phase()===4)s=s.replace(/\d/g,c=>Math.random()<.15?GL[Math.floor(Math.random()*GL.length)]:c);
  el.textContent=s;
}
function askLoc(){
  if(S.locState!=='idle')return;
  if(!navigator.geolocation){S.locState='unsupported';renderLoc();return}
  S.locState='asking';watchLoc();
}
let locWatch=null;
function watchLoc(){
  if(locWatch!==null)return;
  locWatch=navigator.geolocation.watchPosition(
    p=>{S.locState='ok';S.loc={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};renderLoc()},
    e=>{if(e.code===1){S.locState='denied';navigator.geolocation.clearWatch(locWatch);locWatch=null}else if(S.locState!=='ok')S.locState='idle';renderLoc()},
    {enableHighAccuracy:true,maximumAge:10000,timeout:20000});
}
// pede permissão no primeiro toque (gesto do usuário), nunca em silêncio
document.addEventListener('pointerdown',askLoc,{once:true});
// bateria: GPS desligado com a aba oculta; volta ao reabrir (só se já havia permissão)
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(locWatch!==null){navigator.geolocation.clearWatch(locWatch);locWatch=null}}
  else if(S.locState==='ok'||S.locState==='asking')watchLoc();
});
renderLocOrigin();
setInterval(()=>{if(phase()===4){renderLoc();renderLocOrigin()}},900);

/* ================= LOOPS ================= */
setInterval(renderLive,1500);
setInterval(()=>{if(S.demo&&!S.override&&S.demoPhase<4){S.demoPhase++;sweepSnd(200,1300,.35);render()}},90000);   // muda de fase: varredura
// Texto só se mexe ao vivo na fase 4 (glitch) e durante erros de transmissão
let wasBursting=false;
setInterval(()=>{const b=bursting();
  if((phase()===4&&!REDUCED)||b||wasBursting){S.tick++;$('#txt').textContent=buildText()}
  if(b!==wasBursting)$('#foot').textContent=footText();
  wasBursting=b},200);
// Erros de transmissão propositais: rajadas curtas em intervalos irregulares (mais frequentes a cada fase)
function scheduleBurst(){
  const d=[18,13,9,6][phase()-1]*1000*(.7+Math.random()*.8);
  setTimeout(()=>{if(!REDUCED&&!S.standby&&!S.arriving){S.burstUntil=Date.now()+700+Math.random()*900;S.burstSeed=Math.random();S.bursts++;beep(70,.14,'sawtooth',.03)}scheduleBurst()},d);   // erro de transmissão: estática + grave distorcido
}
S.burstUntil=0;S.burstSeed=0;scheduleBurst();
setInterval(()=>{store.set('hours',S.hours+(Date.now()-S.t0)/36e5);store.set('last',Date.now());store.set('rejected',S.rejected)},5000);
window.addEventListener('pagehide',()=>{store.set('hours',S.hours+(Date.now()-S.t0)/36e5);store.set('last',Date.now())});

paintSliders();render(true);renderLive();resetCountdown();
</script>
<script src="temporal.js"></script>
<script>if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
